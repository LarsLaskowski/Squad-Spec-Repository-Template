name: Python CI

on:
  pull_request:
    paths:
      - "**/*.py"
      - "ruff.toml"
      - ".github/workflows/python-ci.yml"
      - "core/**"
      - "profiles/**"
      - "seed/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly, picks up new CodeQL/Bandit rules

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff bandit
      - name: Syntax check
        run: git ls-files '*.py' | xargs python -m py_compile
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: git ls-files '*.py' | xargs bandit -q -ll -ii

  template-check:
    name: Template self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python tools/template-check.py

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
