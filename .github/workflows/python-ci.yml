name: Python CI

on:
  pull_request:
    paths:
      - "**/*.py"
      - "ruff.toml"
      - ".github/workflows/python-ci.yml"
      - "core/**"
      - "profiles/**"
      - "seed/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly, picks up new CodeQL/Bandit rules

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: "pip install --only-binary :all: ruff==0.17.2 bandit==1.9.4"
      - name: Syntax check
        run: git ls-files '*.py' | xargs python -m py_compile
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: git ls-files '*.py' | xargs bandit -q -ll -ii

  template-check:
    name: Template self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # template-check.py compares the rule files with their merge base with origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: "pip install --only-binary :all: pyyaml==6.0.3 complexipy==8.0.1"
      - run: python -m unittest discover tools
      - run: python tools/template-check.py

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependabot runs and fork pull requests do not receive repository secrets, so SONAR_TOKEN would be
    # empty and the scan would fail; skip the job for those.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # disable shallow clone for better analysis relevancy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: "pip install --only-binary :all: pyyaml==6.0.3 coverage==7.17.0"
      - name: Generate coverage
        run: |
          coverage run -m unittest discover tools
          coverage run tools/template-check.py  # the self-check runs apply-template.py and its smoke tests
          coverage combine
          coverage xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
