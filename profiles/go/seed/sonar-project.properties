sonar.projectKey={{sonar-project-key}}
sonar.organization={{sonar-organization}}

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,bin/**,dist/**

sonar.go.coverage.reportPaths=coverage.out

# Squad and agent tooling is developer tooling, not production code.
sonar.coverage.exclusions=.squad/**,.claude/**
