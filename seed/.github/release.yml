# Controls the notes GitHub generates for a release ("Generate release notes" on the release page).
# GitHub groups by pull request label only (not by title); the squad's create-pr sets the label.
# A pull request lands in the first category whose labels it carries, so the order matters.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: "Breaking changes"
      labels:
        - breaking-change
    - title: "Features"
      labels:
        - enhancement
        - feature
    - title: "Security fixes"
      labels:
        - security
    - title: "Bug fixes"
      labels:
        - bug
    - title: "Other changes"
      labels:
        - "*"
