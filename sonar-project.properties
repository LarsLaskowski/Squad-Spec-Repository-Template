sonar.projectKey=networlddev_Squad-Spec-Repository-Template
sonar.organization=networlddev

# The repository holds no product code; its Python tools are what every target receives on a refresh, so
# SonarQube Cloud analyses them here, before a target's analysis does. The scanner skips hidden directories below a
# source directory, so each `.squad/tools` and `.claude/hooks` is listed itself; tools/template-check.py fails when a
# Python file a target receives is not covered.
sonar.sources=tools,\
  core/.claude/hooks,\
  core/.squad/tools,\
  multi/.squad/tools,\
  profiles/dotnet/managed/.squad/tools,\
  profiles/dotnet/seed/.squad/tools,\
  profiles/go/managed/.squad/tools,\
  profiles/go/seed/.squad/tools,\
  profiles/node/managed/.squad/tools,\
  profiles/node/seed/.squad/tools,\
  profiles/typescript/managed/.squad/tools,\
  profiles/typescript/seed/.squad/tools
sonar.inclusions=**/*.py
sonar.tests=tools
sonar.test.inclusions=tools/test_*.py
sonar.exclusions=tools/test_*.py
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
