sonar.projectKey=networlddev_Squad-Spec-Repository-Template
sonar.organization=networlddev

# The repository holds no product code; its Python tools are what every target receives on a refresh, so
# SonarQube Cloud analyses them here, before a target's analysis does.
sonar.sources=tools,core,profiles,multi,seed
sonar.inclusions=**/*.py
sonar.tests=tools
sonar.test.inclusions=tools/test_*.py
sonar.exclusions=tools/test_*.py
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
